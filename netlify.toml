# Routing lives in the function files themselves, via
#   export const config = { path: '/...' }
# Redirects here would shadow those paths, so there are none.

[build]
  publish = "public"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
# Env vars are baked in at build time, so a change in the Netlify UI
# only reaches the functions after a rebuild. ADMIN_TOKEN added 2026-10-09.
