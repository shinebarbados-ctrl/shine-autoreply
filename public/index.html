<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shine Inbox</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b23; --line:#232a35; --ink:#e8edf4; --muted:#8b97a8;
    --blue:#39a7e8; --orange:#f2941d; --green:#35c06a; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .logo{font-weight:700;letter-spacing:.5px}
  .logo span{color:var(--blue)}
  .logo b{background:var(--orange);color:#111;padding:1px 7px;border-radius:4px;font-size:11px;letter-spacing:2px;margin-left:6px}
  input,textarea,button{font:inherit}
  input,textarea{background:#0b0f14;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 11px;width:100%}
  button{background:var(--blue);border:0;color:#04121c;font-weight:600;border-radius:8px;padding:9px 14px;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .wrap{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px;align-items:start}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .panel h2{margin:0;padding:12px 14px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--line)}
  .row{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:#1b2230}
  .row.active{background:#1b2230;border-left:3px solid var(--blue)}
  .row .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .row .who{font-weight:600}
  .row .last{color:var(--muted);font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .tag.wa{color:var(--green);border-color:#1e4a33}
  .tag.ig{color:#e879b9;border-color:#4a2438}
  .tag.paused{color:var(--orange);border-color:#4a3616}
  .thread{padding:14px;max-height:56vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:75%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{background:#1e2836;align-self:flex-start;border-bottom-left-radius:3px}
  .msg.assistant{background:#13405e;align-self:flex-end;border-bottom-right-radius:3px}
  .msg .t{display:block;font-size:11px;color:var(--muted);margin-top:4px}
  .composer{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
  .bar{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .empty{padding:28px 14px;text-align:center;color:var(--muted)}
  .token{display:flex;gap:8px;align-items:center;margin-left:auto;max-width:360px;width:100%}
</style>
</head>
<body>
<header>
  <div class="logo">Shine<span> Auto-Reply</span><b>INBOX</b></div>
  <div class="token">
    <input id="token" type="password" placeholder="Admin token" autocomplete="off">
    <button id="save">Connect</button>
  </div>
</header>

<div class="wrap">
  <section class="panel">
    <h2>Conversations <span id="count" class="muted"></span></h2>
    <div id="list"><div class="empty">Enter your admin token to connect.</div></div>
  </section>

  <section class="panel">
    <div class="bar">
      <strong id="title">No conversation selected</strong>
      <span id="state" class="tag"></span>
      <span style="flex:1"></span>
      <button class="ghost" id="pause">Pause bot 12h</button>
      <button class="ghost" id="resume">Resume bot</button>
    </div>
    <div class="thread" id="thread"><div class="empty">Pick a conversation on the left.</div></div>
    <div class="composer">
      <textarea id="reply" rows="2" placeholder="Reply as Shine (this pauses the bot in this chat)"></textarea>
      <button id="send">Send</button>
    </div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById($id(id));
function $id(x){return x}
let token = localStorage.getItem('shineToken') || '';
let current = null;
let rows = [];

document.getElementById('token').value = token;
document.getElementById('save').onclick = () => {
  token = document.getElementById('token').value.trim();
  localStorage.setItem('shineToken', token);
  refresh();
};

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { 'Content-Type': 'application/json', 'x-admin-token': token, ...(options.headers || {}) },
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
  return res.json();
}

function esc(s){return String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

async function refresh() {
  if (!token) return;
  try {
    rows = await api('/admin/conversations');
  } catch (e) {
    document.getElementById('list').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    return;
  }
  document.getElementById('count').textContent = rows.length ? '(' + rows.length + ')' : '';
  const list = document.getElementById('list');
  if (!rows.length) { list.innerHTML = '<div class="empty">No conversations yet.</div>'; return; }
  list.innerHTML = rows.map((r, i) => `
    <div class="row ${current && current.channel===r.channel && current.userId===r.userId ? 'active':''}" data-i="${i}">
      <div class="top">
        <span class="who">${esc(r.name || r.userId)}</span>
        <span>
          <span class="tag ${r.channel==='whatsapp'?'wa':'ig'}">${r.channel==='whatsapp'?'WA':'IG'}</span>
          ${r.paused ? '<span class="tag paused">paused</span>' : ''}
        </span>
      </div>
      <div class="last">${esc(r.lastMessage || '')}</div>
    </div>`).join('');
  list.querySelectorAll('.row').forEach(el => {
    el.onclick = () => open(rows[Number(el.dataset.i)]);
  });
  if (current) loadThread();
}

function open(r) { current = r; loadThread(); refresh(); }

async function loadThread() {
  if (!current) return;
  document.getElementById('title').textContent = current.name || current.userId;
  const st = document.getElementById('state');
  st.textContent = current.paused ? 'bot paused: ' + (current.pauseReason || '') : 'bot active';
  st.className = 'tag ' + (current.paused ? 'paused' : '');
  try {
    const c = await api('/admin/conversation?channel=' + encodeURIComponent(current.channel) + '&userId=' + encodeURIComponent(current.userId));
    const t = document.getElementById('thread');
    t.innerHTML = c.history.map(m => `<div class="msg ${m.role}">${esc(m.content)}<span class="t">${new Date(m.at).toLocaleString('en-GB')}</span></div>`).join('') || '<div class="empty">No messages.</div>';
    t.scrollTop = t.scrollHeight;
  } catch (e) {
    document.getElementById('thread').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}

document.getElementById('pause').onclick = async () => {
  if (!current) return;
  await api('/admin/pause', { method:'POST', body: JSON.stringify({ channel: current.channel, userId: current.userId, hours: 12 }) });
  refresh();
};
document.getElementById('resume').onclick = async () => {
  if (!current) return;
  await api('/admin/resume', { method:'POST', body: JSON.stringify({ channel: current.channel, userId: current.userId }) });
  refresh();
};
document.getElementById('send').onclick = async () => {
  const box = document.getElementById('reply');
  const text = box.value.trim();
  if (!current || !text) return;
  try {
    await api('/admin/send', { method:'POST', body: JSON.stringify({ channel: current.channel, userId: current.userId, text }) });
    box.value = '';
    loadThread(); refresh();
  } catch (e) { alert(e.message); }
};

refresh();
setInterval(refresh, 8000);
</script>
</body>
</html>
